<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4c81" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Banakar FinClub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Banakar FinClub</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        const pageOpenedAt = Date.now();
        const hadOldVersion = Boolean(navigator.serviceWorker.controller);
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js", { scope: "./", updateViaCache: "none" })
            .then((reg) => {
              // Look for a new version whenever the app comes back to the screen.
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") reg.update().catch(() => {});
              });
            })
            .catch(() => {});
        });
        // If a new version takes over while the app is still starting up, reload once
        // so the new code runs now. Later in a session, it waits for the next open.
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadOldVersion || Date.now() - pageOpenedAt > 15000) return;
          try {
            if (sessionStorage.getItem("bfc_sw_reloaded")) return;
            sessionStorage.setItem("bfc_sw_reloaded", "1");
          } catch (_) {}
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
